services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: portfolio
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://portfolio:${DB_PASSWORD}@db:5432/portfolio
      CORS_ORIGIN: https://asiyaad.tech
      SANDBOX_RUNNER_URL: http://host.docker.internal:4000
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_TO: ${MAIL_TO}
      RUNNER_API_KEY: ${RUNNER_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.asiyaad.tech
        NEXT_PUBLIC_SANDBOX_RUNNER_URL: https://sandbox.asiyaad.tech
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  sandbox-runner:
    build:
      context: ..
      dockerfile: apps/sandbox-runner/Dockerfile
    network_node: host
    environment:
      RUNNER_API_KEY: ${RUNNER_API_KEY}
      MAX_SANDBOXES: 4
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  db_data:
